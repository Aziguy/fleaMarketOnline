name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mfoundi
          POSTGRES_USER: mfoundi
          POSTGRES_PASSWORD: mfoundi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mfoundi"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Dépendances
        run: |
          sudo apt-get install -y gettext
          pip install -r requirements/dev.txt
          npm ci
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Assets et traductions
        run: |
          npm run build
          python manage.py compilemessages --ignore=node_modules
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
        env:
          DATABASE_URL: postgres://mfoundi:mfoundi@localhost:5432/mfoundi
      - name: Tests
        run: pytest
      - name: Migrations sur PostgreSQL
        run: python manage.py migrate --noinput
        env:
          DATABASE_URL: postgres://mfoundi:mfoundi@localhost:5432/mfoundi
