{% extends "base.html" %}{% load i18n static %}
{% block title %}{% translate "Hors ligne" %}{% endblock %}
{% block content %}
<div class="container-page flex flex-col items-center py-24 text-center">
  <div class="relative">
    <div class="aurora -inset-10 bg-brand-400/30"></div>
    <img src="{% static 'img/logo-mark.svg' %}" alt="" class="relative h-20 w-20">
  </div>
  <h1 class="mt-8 text-3xl">{% translate "Vous êtes hors ligne" %}</h1>
  <p class="mt-3 max-w-md text-stone-500">{% translate "Vérifiez votre connexion internet. Les pages déjà consultées restent disponibles." %}</p>
  <button type="button" onclick="location.reload()" class="btn-primary mt-8">{% translate "Réessayer" %}</button>
</div>
{% endblock %}
