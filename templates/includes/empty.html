<div class="card card-body flex flex-col items-center py-12 text-center">
  <div class="flex h-14 w-14 items-center justify-center rounded-full bg-brand-50 text-2xl">{{ icon|default:"🛍️" }}</div>
  <p class="mt-4 font-medium text-stone-800">{{ title }}</p>
  {% if text %}<p class="mt-1 max-w-md text-sm text-stone-500">{{ text }}</p>{% endif %}
  {% if url %}<a href="{{ url }}" class="btn-primary mt-5">{{ cta }}</a>{% endif %}
</div>
